[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowforge"
version = "0.1.0"
description = "Deterministic DAG Workflow Engine, Chaos Fault-Injection & Time-Travel Execution Observatory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "aiohttp>=3.10.0",
    "websockets>=12.0",
    "psutil>=5.9.0",
]

[project.scripts]
flowforge = "flowforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
