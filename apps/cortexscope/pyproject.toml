[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortexscope"
version = "0.1.0"
description = "Local LLM Cognitive, Token Latency & Hardware Energy Telemetry HUD for Ollama + Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "aiohttp>=3.10.0",
    "websockets>=12.0",
    "psutil>=5.9.0",
]

[project.scripts]
cortexscope = "cortexscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
